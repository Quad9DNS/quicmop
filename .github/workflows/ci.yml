name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}

      - name: Setup cargo deny
        run: cargo install cargo-deny

      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get -y install protobuf-compiler

      - name: Run checks
        run: make check-all

      - name: Run tests
        run: make test

  build:
    name: Try building the binary and docs
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}

      - name: Install scdoc
        run: sudo apt-get update -y && sudo apt-get -y install scdoc

      - name: Install protoc
        run: sudo apt-get update -y && sudo apt-get -y install protobuf-compiler

      - name: Build docs
        run: make doc

      - name: Build binaries
        run: make all
